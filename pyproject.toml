[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "E501",  # long lines: the UI has long CSS/HTML strings
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # asserts are fine in tests
"src/app.py" = ["E402"]  # imports follow the sys.path setup on purpose

[tool.coverage.run]
source = ["src"]
omit = ["src/app.py"]  # Streamlit UI script, exercised by hand / browser smoke test

[tool.coverage.report]
fail_under = 85
show_missing = true
